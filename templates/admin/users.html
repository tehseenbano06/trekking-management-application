{% extends "base.html" %}
{% block title %}Manage Users{% endblock %}
{% block content %}
<h3 class="mb-3">Manage Trekkers</h3>

<form method="GET" class="row g-2 mb-3">
    <div class="col-md-4">
        <input type="text" name="q" value="{{ q }}" class="form-control" placeholder="Search user by name">
    </div>
    <div class="col-md-2">
        <button class="btn btn-secondary w-100">Search</button>
    </div>
</form>

<table class="table table-bordered bg-white">
    <thead>
        <tr><th>ID</th><th>Name</th><th>Email</th><th>Status</th><th>Actions</th></tr>
    </thead>
    <tbody>
        {% for u in users %}
        <tr>
            <td>{{ u.id }}</td>
            <td>{{ u.name }}</td>
            <td>{{ u.email }}</td>
            <td>
                {% if u.is_active %}
                    <span class="badge bg-success">Active</span>
                {% else %}
                    <span class="badge bg-danger">Blacklisted</span>
                {% endif %}
            </td>
            <td>
                <form method="POST" action="{{ url_for('admin.toggle_user_active', user_id=u.id) }}">
                    <button class="btn btn-sm btn-outline-danger">
                        {{ "Reactivate" if not u.is_active else "Blacklist" }}
                    </button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
